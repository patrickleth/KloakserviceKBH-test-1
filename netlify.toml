# Ét repo, ét Netlify-site pr. kunde. Sæt KUNDE (mappenavn under sites/) og MODE under
# Site configuration > Environment variables. MODE=production gør siden indekserbar og
# formularen aktiv. Alt andet end production bygger en testversion med noindex.
[build]
  command = "npm run build"
  publish = "dist/current"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
